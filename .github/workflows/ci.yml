name: Trigger Jenkins

on:
  push:
    branches:
      - main
      - dev

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Jenkins build
        run: |
          curl -f -X POST \
            "${{ secrets.JENKINS_URL }}/job/TeetimeFinder/build" \
            --user "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_TOKEN }}"
